name: Build Debian 13 rootfs

on:
  push:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: BenchOS.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support

      - name: Bootstrap Debian 13 (trixie) rootfs
        run: |
          sudo rm -rf rootfs
          sudo debootstrap --arch=amd64 --variant=minbase trixie rootfs http://deb.debian.org/debian
          sudo tar -C rootfs -czf BenchOS.tar.gz .
          sudo chown $(id -u):$(id -g) BenchOS.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchOS
          path: BenchOS.tar.gz

  release:
    needs: build-rootfs
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BenchOS

      - name: Create and upload GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: BenchOS-${{ github.sha }}
          name: BenchOS ${{ github.sha }}
          files: ./BenchOS.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
